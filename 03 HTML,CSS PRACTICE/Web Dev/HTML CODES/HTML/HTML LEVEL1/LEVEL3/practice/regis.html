<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form </title>
</head>
<body>
    <center> <h1>Registration Form </h1></center>
    <form>
        <div>
            <label for="name"> First Name:</label>
            <input type="text" id="name" name="user">
                
        </div>
        <div>
            <label for="name"> Last Name:</label>
            <input type="text" id="name1" name="lastname">
             

        </div><br>
        <div>
            Please select gender:
            <select id="gender" name="gen" >
                <option value="male"> male</option>
                <option value="female"> female</option>
                <option value="Gay"> gay</option>
                <option value=" Gay & female">some time gay & female </option>
            </select>
        </div><br>
        <div>
            select your best 5 actor:<br>
            <input type="checkbox" name="actor" id="actor">
            <label for="actor"> srk</label>
            <input type="checkbox" name="actor" id="actor1">
            <label for="actor1"> thala</label>
            <input type="checkbox" name="actor" id="actor2">
            <label for="actor2"> anil kapoor</label>
            <input type="checkbox" name="actor" id="actor3">
            <label for="actor3"> mithun</label>
            <input type="checkbox" name="actor" id="actor4">
            <label for="actor4"> bobby</label>
            <input type="checkbox" name="actor" id="actor5">
            <label for="actor5"> sallu</label>
            <input type="checkbox" name="actor" id="actor6">
            <label for="actor6"> sunil</label>
            <input type="checkbox" name="actor" id="actor7">
            <label for="actor7"> sunny deol</label>
            <input type="checkbox" name="actor" id="actor8">
            <label for="actor8"> ajay</label>
            <input type="checkbox" name="actor" id="actor9">
            <label for="actor9"> akshay</label>
        </div><br>
        <div>
            Select your fav player:
          <br>
            <input type="radio" id="player" name="play">
            <label for="player">Virat Kohli </label><br>
            <input type="radio" id="player1" name="play">
            <label for="player1">Mohd. Shami</label><br>
            <input type="radio" id="player2" name="play">
            <label for="player2">Rohit Sharma </label><br>
            <input type="radio" id="player3" name="play">
            <label for="player3">MS Dhoni </label><br>

        </div><br>
        <button type="submit"> Register</button>
        <button type="button"> Click me</button>
        <button type="reset"> Reset the form<b>:)</b></button><br><br>
        <div>
            Select your Voice hearing Power:
            <input type="range" id="volume" min="10" max="150" name="vol" value="50" step="10">
            <label for="volume"> volume</label>
        </div>
        <br>
        <div>
            <label for="feedback">Enter type your valuable feedback:</label><br>
            <textarea id="feedback" placeholder="type here" rows="5" cols="45"></textarea>

        </div>
        
    </form>
    
</body>
</html>

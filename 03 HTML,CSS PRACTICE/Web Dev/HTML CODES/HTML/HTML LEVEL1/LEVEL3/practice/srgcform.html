<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRGC COLLEGE FORMS</title>
    <link rel="stylesheet" href="srgcform.css">
</head>
<body style="text-align: center;">
    <center><h1>REGISTRATION FORM</h1></center>
    <form action="/server" > 
        <div>
            <label for="username"> Name:</label>
            <input type="text" id="username" name="user">
        </div>
        <div>
            <label for="father"> Father name:</label>
            <input type="text" id="father" name="father">
        </div>
        <div>
            <label for="mother"> Mother name:</label>
            <input type="text" id="mother" name="mother">

        </div>
        <div>
            <label for="religion"> Religion:</label>
            <input type="text" id="religion" name=" rel">

        </div>
        <div>
            <label for="cast"> Cast:</label>
            <input type="text" id="cast" name="cast">
        </div>
        <div>
            <label for="gender"> Gender:</label>
            <input type="text" name="gen" id="gender">
        </div>
        <div>
            <label for="phone">Phone No:</label>
            <input type="text" name="num" id="phone">
        </div>
        <div>
            <label for="email"> Email:</label>
            <input type="text" id="email" name="email">
        </div>

    </form>
    
</body>
</html>

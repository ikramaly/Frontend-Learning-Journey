<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form action="/action">
        <h1><center>Registration Form </center></h1>
        <label for="Firstname">First Name :</label>
        <input type="text" name="name" id="Firstname" placeholder="First Name">
        <label for="lastname">Last Name :</label>
        <input type="text" name="lastname" id="lastname" placeholder="Last Name">
        <br><br>
        <div>
            <label for="select">Please Select Your Gender:</label>
            <select name="gender" id="select">
                <option value="male">Male</option>
                <option value="Female">Female</option>
                <option value="Hijda">Hijda</option>
            </select>
        </div>
        <br>
        <div>
            <inline>Do you agree to all terms of service ?</inline>
            <input type="checkbox" name="check" id="checkbox">
            <label for="checkbox"> Yes , I Agree.</label>
        </div>
        <br>
        <p>For Registration, Click here </p>
        <button type="submit"> Register </button>



    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Qeustion 7</title>
</head>
<body>
    <form action="/server">
        <div> 
            <label for="username"> UserName:</label>
            <input type="text" name="userName" id="username">
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
        </div>
        <br>
        <div>
            <label for="num">Number:</label>
            <input type="number" name="" id="num">
        </div>
        <br>
        <div>
            <label for="password">Password:</label>
            <input type="password" name="pass" id="password">
        </div><br>
        <button>Submit</button>
        <button type="Click Me"> Click </button>
        <button type="reset">Reset</button>
       <input type="button" value="Just Click Usually"> 
    </form><hr>

    <form action="https://www.youtube.com/results">
        
        <label for="Search">YouTube : </label>
        <input type="text" placeholder="Search Anything......" name="search_query" >
        <button type="submit"> Submit </button>
    </form>
    <hr>
    <form action="https://www.google.com/search">
        <div>
            <label for="search">Google :</label>
            <input type="text" placeholder="Search Anything......"  name="q" id="search">
            <button>Submit</button>
        </div>
    </form><br>
    <form action="/server">
        
        <div>
            <label for="check">Are You 18+ Years Old :</label>
            <input type="checkbox" name="check" id="check">
        </div>
        <div>
            <label for="check1">You Are Indian :</label>
            <input type="checkbox" name="check" id="check1">
        </div>
        <div>
            <p>Choose Your Fav Fruits : </p>
            <label for="apple">Apple :  </label>
            <input type="radio" id="apple" name="fruits" value="Apple" ><br>
            <label for="mango">Mango :</label>
            <input type="radio" id="mango" name="fruits" value="Mango" > <br>
            <label for="Orange">Orange : </label>
            <input type="radio" id="Orange" name="fruits" value="Orange" >
        </div>
        <button type="submit">Submit</button>
        <div>
            <p>Choose Your Subject : </p>
            <label for="Math">Math  </label>
            <input type="checkbox" id="Math" name="sub1" value="math" ><br>
            <label for="science">Science</label>
            <input type="checkbox" id="science" name="sub2" value="science" > <br>
            <label for="English">English </label>
            <input type="checkbox" id="English" name="sub" value="Orange" >
        </div>
        <div>
            Choose Your profession :
            <select name="profession" id="profession"> 
                <option > Select </option>
                <option value="stu">Student</option>
                <option value="dev">Developer</option>
                <option value="AI" >Artificial Intelligence </option>
                <option value="DA">Data Analyst</option>
                <option value="DS">Data Scientest</option>
            </select>
            <br>
            <input type="range" 
            name="Vol"
            id="range" 
            max="100"
            min="0" 
            step="5" 
            value="10" >
            <label for="range">Volume </label>
            <br>
            <input type="range" 
            name="weight" 
            id="weight" 
            min="20" 
            max="100" 
            step="1" 
            value="40">
            <label for="weight"> Weight </label>
        </div>
        <div>
            <label for="feedback">Please Provide Your Valuable FeedBack : </label>
            <textarea name="fb" id="feedback" cols="100" rows="10" placeholder="👍" > </textarea>
        </div>
            
    </form>
   
 </body>
</html>
